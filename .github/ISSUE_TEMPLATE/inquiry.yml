name: "Portfolio inquiry / 포트폴리오 문의"
description: "Public questions or collaboration proposals for the SORI YOO portfolio / 공개 문의 게시판"
title: "[문의] "
body:
  - type: markdown
    attributes:
      value: |
        **공개 게시판입니다.** 이메일, 전화번호, 개인정보 또는 기밀 사항을 입력하지 마세요.
        This is a public board. Please do not include private contact details or confidential information.
        작성 후 아래의 **Submit new issue** 버튼을 눌러야 최종 등록됩니다.
  - type: dropdown
    id: category
    attributes:
      label: "문의 유형 / Inquiry type"
      options:
        - general
        - collaboration
        - project
        - other
    validations:
      required: true
  - type: textarea
    id: inquiry-details
    attributes:
      label: "문의 내용 / Your message"
      description: "프로젝트, 행사 기획 또는 협업 관련 내용을 작성해 주세요."
      placeholder: "문의나 제안의 내용을 작성해 주세요."
    validations:
      required: true
